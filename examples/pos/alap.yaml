# alap.yaml — Alap Mini POS Project Manifest
name: mini-pos
version: 1.0.0
description: "Mini POS — NilLang + Alap cross-platform reference app (Catalog, Cart, Checkout, SQLite)"

entry: src/main.nil

permissions:
  - storage.read
  - storage.write
  - notifications

targets:
  linux:
    display: wayland
  android:
    minSdk: 26
    targetSdk: 35
  onuron:
    arch: arm64

dependencies: {}
