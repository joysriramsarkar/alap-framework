name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Verify module dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run unit & integration tests
        run: go test -v ./...

      - name: Build binaries (Unix)
        run: |
          mkdir -p bin
          go build -v -o bin/alap ./cmd/nil
          go build -v -o bin/alapc ./cmd/nilc
          go build -v -o bin/alap-lsp ./cmd/nills
        if: runner.os != 'windows'

      - name: Build binaries (Windows)
        run: |
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" }
          go build -v -o bin/alap.exe ./cmd/nil
          go build -v -o bin/alapc.exe ./cmd/nilc
          go build -v -o bin/alap-lsp.exe ./cmd/nills
        if: runner.os == 'windows'

      - name: Verify CLI tools & project checks (Unix)
        run: |
          ./bin/alap --help
          ./bin/alap-lsp --version
          ./bin/alap check
          ./bin/alap build nilos
          ./bin/alap build android
          ./bin/alap build ios
          ./bin/alap build linux
          ./bin/alap run examples/hello/main.nil
          ./bin/alap run examples/calculator/main.nil
          ./bin/alap run examples/social/main.nil
          ./bin/alap run examples/todo/main.nil
        if: runner.os != 'windows'

      - name: Verify CLI tools & project checks (Windows)
        run: |
          .\bin\alap.exe --help
          .\bin\alap-lsp.exe --version
          .\bin\alap.exe check
          .\bin\alap.exe build nilos
          .\bin\alap.exe build android
          .\bin\alap.exe build ios
          .\bin\alap.exe build linux
          .\bin\alap.exe run examples/hello/main.nil
          .\bin\alap.exe run examples/calculator/main.nil
          .\bin\alap.exe run examples/social/main.nil
          .\bin\alap.exe run examples/todo/main.nil
        if: runner.os == 'windows'
